# FX

USDJPY:
  sec_type: "CASH"
  ibkr_symbol: "USD"          # CASH convention: symbol = base currency
  currency: "JPY"              # currency = quote currency
  exchange: "IDEALPRO"
  what_to_show: "MIDPOINT"     # forex has no consolidated trade tape
  use_regular_trading_hours: false
  tick_size: 0.001
  asset_class: "fx"
  expected_session: "24/5"


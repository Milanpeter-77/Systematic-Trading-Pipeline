# DISABLED: every entry below was empirically confirmed blocked via
# tests/integration/test_ibkr_subscriptions.py (its "deep dive" section
# specifically isolates *why*, not just *whether*, each fails). Re-run that
# script to confirm before re-enabling anything here -- account-level data
# entitlements have already shifted once mid-investigation (see below).
#
# AAPL (STK, US) and DAX (IND, Germany/EUREX): both reliably fail with
# error 2188 ("Up-to-the-second historical data requires additional
# subscription for the API"). This is NOT literally about "up-to-the-second"
# timing -- the deep dive tried delayed-type + blank endDateTime, live-type +
# a fixed past endDateTime, and delayed-type + a fixed past endDateTime, and
# all three failed identically. A direct reqMktData streaming probe on AAPL
# made the real cause explicit: error 10089, "Requested market data requires
# additional subscription for API ... Delayed market data is available."
# I.e. the API layer needs its own paid live-data entitlement, separate from
# whatever grants delayed/TWS-UI viewing access -- and even delayed data
# didn't unlock reqHistoricalData for this contract. Meanwhile VOD and SAP
# (also STK, non-US) fetch fine, so this is not a blanket STK/IND ban --
# it's entitlement-specific per symbol/exchange (DAX likely needs its own
# separate index-value-bundle subscription on top of underlying-equity
# access, since SAP works but DAX doesn't on the same Xetra/EUREX market).
#
# ETHUSD and BTCUSD (CRYPTO, PAXOS): both fail with a distinct, specific
# error -- "No market data permissions for PAXOS CRYPTO" -- confirmed
# reproducible on both symbols, so this is a venue-level (PAXOS) permission
# gap, not symbol-specific. Notably ETHUSD was an active, previously-working
# instrument before this investigation; something has since changed on the
# account's crypto market-data entitlement (or it was already lapsed and
# simply hadn't been re-tested). Needs checking directly on the IBKR account
# (Market Data Subscriptions) before either symbol can be re-enabled.

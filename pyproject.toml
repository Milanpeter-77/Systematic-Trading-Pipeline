[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-trading-pipeline"
version = "0.1.0"
description = "A systematic trading pipeline for backtesting and live (paper) trading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "pyarrow",
    "scipy",
    "statsmodels",
    "ibapi==10.45.1",
    "protobuf",
    "python-dotenv",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["systematic_trading*"]